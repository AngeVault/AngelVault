# AngeVault : actions d'entree (Edition > Input Manager... dans l'editeur)
# [Nom] button|axis deadzone=<0..1>
#   key <Touche> [echelle] | mouse <Left|Right|Middle|Extra1|Extra2> [echelle] | wheel [echelle]
#   joybutton <manette> <bouton> [echelle] | joyaxis <manette> <X|Y|Z|R|U|V|PovX|PovY> [echelle]

[Horizontal] axis
key Left -1
key Right
key Q -1
key A -1
key D
joyaxis 0 X

[Vertical] axis
key Up -1
key Down
key Z -1
key W -1
key S
joyaxis 0 Y

[Zoom] axis
key Add
key Subtract -1
key Equal
key Hyphen -1

[ZoomWheel] axis
wheel

[CameraX] axis
key J -1
key L

[CameraY] axis
key I -1
key K
